<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#ff8a00" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/vybe-icon.svg" />
    <title>VybeChat — Central de comunicação</title>
    <style>
      html, body { min-height: 100%; margin: 0; background: #07080b; color: #ffd39d; }
      #root:empty {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: radial-gradient(ellipse at 50% -25%, rgba(255, 123, 10, .2), transparent 42rem), #07080b;
      }
      #root:empty::after {
        content: "VYBECHAT"; color: #ff9b36; font: 700 24px/1.2 system-ui, sans-serif; letter-spacing: .08em;
        animation: pulse 1.5s infinite ease-in-out alternate;
      }
      @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/cloudflare-main.tsx"></script>
    <script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){})})}</script>
  </body>
</html>
