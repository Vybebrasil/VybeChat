<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diagnóstico VybeChat</title>
    <style>
      html,body{min-height:100%;margin:0;background:#07080b;color:#f5efe9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{box-sizing:border-box;display:grid;min-height:100vh;place-items:center;padding:24px}section{width:min(560px,100%);border:1px solid rgba(255,156,41,.32);background:#101115;padding:28px}strong{color:#ff9b36;font-size:22px;letter-spacing:.08em}p{color:#c3b6a5;line-height:1.55}code{display:block;margin-top:14px;padding:14px;background:#07080b;color:#ffbc76;overflow-wrap:anywhere}a{color:#ff9b36;font-weight:700}
    </style>
  </head>
  <body>
    <main><section><strong>VYBECHAT</strong><p>Esta página não usa React nem componentes do painel. Se você consegue vê-la, o navegador e a conexão com o Pages estão funcionando.</p><code id="result">Executando verificações básicas…</code><p><a href="/">Voltar ao VybeChat</a></p></section></main>
    <script>(function(){var checks=["HTML estático: OK","JavaScript básico: OK","Módulos: "+("noModule" in HTMLScriptElement.prototype?"OK":"indisponível"),"Armazenamento local: "+(function(){try{localStorage.setItem("vybechat-diagnostic","1");localStorage.removeItem("vybechat-diagnostic");return"OK"}catch(e){return"indisponível"}})()];document.getElementById("result").textContent=checks.join("\n")})()</script>
  </body>
</html>
